# nix project actions - run with `x <alias> :<name>` (list with `x <alias> :`).

[actions]
deploy = "zig build deploy -Doptimize=ReleaseFast -Dtarget=x86_64-windows -Dcpu=baseline"
ci = "zig build ci"
checklist = "bash .github/scripts/release-checklist.sh status"
# Check a release candidate before the manual checklist.
preflight = ".github/scripts/release-preflight.ps1"
