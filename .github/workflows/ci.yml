name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so build.zig's `git describe` bakes a real
          # version rather than falling back to "0.0.0".
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # One step, defined in build.zig, so the same gate runs here and on a dev
      # machine (`r nix :ci`, and .githooks/pre-push). Splitting it back into
      # per-check steps here would recreate the drift this replaced: the format
      # check and the linux canary used to exist only in this file, so they were
      # only ever discovered after a push.
      #
      # It runs, in order: zig fmt --check; unit tests; the e2e harness against
      # the real exe and a scratch NIX_HOME; the portable release build (baseline
      # CPU, Windows target) that users install; and a linux cross-compile canary
      # for the never-exercised POSIX paths.
      - name: CI gate
        run: zig build ci
