name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so build.zig's `git describe` bakes a real
          # version rather than falling back to "0.0.0".
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The harness shells out to rg and fd. Without them those checks skip,
      # which is how a green pre-push run and a red CI run stopped contradicting
      # each other out loud - the runner was covering 7 fewer checks than the
      # hook. The harness now treats a skip as a failure, so this is required.
      - uses: ./.github/actions/search-tools

      # One step, defined in build.zig, so the same gate runs here and on a dev
      # machine (`r nix :ci`, and .githooks/pre-push). Splitting it back into
      # per-check steps here would recreate the drift this replaced: the format
      # check and the linux canary used to exist only in this file, so they were
      # only ever discovered after a push.
      #
      # It runs, in order: zig fmt --check; unit tests; the e2e harness against
      # the real exe and a scratch NIX_HOME; the portable release build (baseline
      # CPU, Windows target) that users install; and a linux cross-compile canary
      # for the never-exercised POSIX paths.
      - name: CI gate
        run: zig build ci

  # The Windows job cross-compiles for linux but never RUNS anything there, so
  # a unit test whose fixture only holds on Windows (a `C:\...` path fed to
  # basename) went red on every other OS without anyone seeing it. This runs
  # the unit tests and the e2e harness where the fixtures have to be honest
  # about what they assume. Checks whose subject is Windows itself (cmd's
  # quoting, UAC, the registry PATH, the .exe wrappers, the .cmd context
  # fixtures) skip here as "Windows only" and are counted, not failed.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The harness shells out to rg and fd, and treats a missing tool as a
      # failure (see the Windows job). Ubuntu packages fd as `fdfind`.
      - name: Install ripgrep and fd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          rg --version && fd --version
      - name: Unit tests
        run: zig build test
      - name: End-to-end
        run: zig build e2e
